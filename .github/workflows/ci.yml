name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: This repository is clean
        # The test suite has to contain realistic fixtures to prove the
        # detectors work, so they are recorded in a committed baseline. Any
        # finding outside that baseline still fails the build.
        run: |
          secret-sweep . --no-history --baseline .secret-baseline --fail-on high
          echo "no un-reviewed secrets in the working tree"

      - name: A deleted secret is still found in history
        run: |
          # Credential-shaped values are assembled at runtime so this workflow
          # stays inert to push protection. See tests/test_sweep.py.
          KEY="AKIA""4RTZ7KLM2NOPQ3RS"
          rm -rf /tmp/demo-repo && mkdir /tmp/demo-repo && cd /tmp/demo-repo
          git init -q
          git config user.email "ci@example.com"
          git config user.name "CI"
          printf 'AWS_ACCESS_KEY_ID = "%s"\n' "$KEY" > config.py
          git add . && git commit -q -m "add credentials"
          printf 'import os\nAWS_ACCESS_KEY_ID = os.environ["AWS_ACCESS_KEY_ID"]\n' > config.py
          git add . && git commit -q -m "remove credentials"

          # The working tree must be clean...
          secret-sweep . --no-history --fail-on high
          # ...and the history must not be.
          set +e
          secret-sweep . --history-only --fail-on high > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" -eq 1
          grep -q "aws-access-key-id" out.txt
          grep -q "commit" out.txt

      - name: Values are never printed in full
        run: |
          python - <<'PY'
          from secretsweep.entropy import redact

          secret = "AKIA" + "4RTZ7KLM2NOPQ3RS"
          shown = redact(secret)
          assert secret not in shown, shown
          assert shown.startswith("AKIA"), shown
          print("redacted:", shown)
          PY

      - name: Placeholders are not reported
        run: |
          python - <<'PY'
          from secretsweep.patterns import scan_line

          # Every one of these is a shape that appears in real documentation.
          example = "AKIA" + "IOSFODNN7EXAMPLE"
          for line in [
              f"key = {example}",
              'password = "changeme"',
              'password = "${DB_PASSWORD}"',
              'token = "abc"',
              'password = "passwordpassword"',
              'build_hash = "k3J9xQ2mP7vL4nR8zW"',
              'commit 23bb055a1b2c3d4e5f60718293a4b5c6d7e8f901',
          ]:
              findings = scan_line(line)
              assert not findings, f"false positive on {line!r}: {findings}"
          print("no false positives")
          PY

      - name: JSON output is machine readable
        run: |
          KEY="AKIA""4RTZ7KLM2NOPQ3RS"
          printf 'K = "%s"\n' "$KEY" > leak.py
          set +e
          secret-sweep . --no-history --json > findings.json
          set -e
          rm leak.py
          python - <<'PY'
          import json
          data = json.load(open("findings.json"))
          # Scope the assertions to the planted file; the repository's own
          # README example is a separate, baselined finding.
          leak = [f for f in data["findings"] if f["path"] == "leak.py"]
          assert len(leak) == 1, leak
          item = leak[0]
          assert item["detector"] == "aws-access-key-id", item
          assert item["confidence"] == "high", item
          leaked = "AKIA" + "4RTZ7KLM2NOPQ3RS"
          assert leaked not in json.dumps(data), "full secret leaked into JSON"
          assert data["high"] >= 1, data
          print("json ok:", item["redacted"])
          PY

      - name: Baseline suppresses accepted findings
        run: |
          KEY="AKIA""4RTZ7KLM2NOPQ3RS"
          printf 'K = "%s"\n' "$KEY" > leak.py
          secret-sweep . --no-history --write-baseline baseline.txt > /dev/null 2>&1
          secret-sweep . --no-history --baseline baseline.txt --fail-on high
          # The baseline is committed, so its keys must not contain the secret.
          ! grep -q "$KEY" baseline.txt
          rm leak.py baseline.txt
          echo "baseline suppressed the accepted finding"
