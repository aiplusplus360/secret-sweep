[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-sweep"
version = "0.1.0"
description = "Find credentials in a repository — including git history, where deleted secrets still live."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []

[project.scripts]
secret-sweep = "secretsweep.cli:main"

[tool.setuptools.packages.find]
include = ["secretsweep*"]
